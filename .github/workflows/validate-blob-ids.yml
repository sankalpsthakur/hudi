name: Validate hudi-common change

on:
  push:
    branches:
      - 'validate/**'
  workflow_dispatch:

env:
  MVN_ARGS: -e -ntp -B -V -Dgpg.skip -Djacoco.skip -Dscala-2.12 -Dspark3.5 -Dflink2.2
  NEW_TESTS: TestHoodieSchemaUtils,TestInternalSchemaConverter,TestSerDeHelper

jobs:
  with-change:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build hudi-common and the modules it needs
        run: mvn install -DskipTests -pl hudi-common -am $MVN_ARGS
      - name: Run the schema tests
        run: mvn test -Punit-tests -pl hudi-common -Dtest="$NEW_TESTS" -Dsurefire.failIfNoSpecifiedTests=false $MVN_ARGS

  with-change-module:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build hudi-common and the modules it needs
        run: mvn install -DskipTests -pl hudi-common -am $MVN_ARGS
      - name: Run every unit test of hudi-common
        run: mvn test -Punit-tests -pl hudi-common $MVN_ARGS

  without-change:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Put the two main sources back to the base commit
        run: |
          git log --oneline -3
          git checkout HEAD~2 -- \
            hudi-common/src/main/java/org/apache/hudi/common/schema/internal/convert/InternalSchemaConverter.java \
            hudi-common/src/main/java/org/apache/hudi/common/schema/internal/utils/SerDeHelper.java
          git status --short
      - name: Build hudi-common and the modules it needs
        run: mvn install -DskipTests -pl hudi-common -am $MVN_ARGS
      - name: Run the schema tests (expected to fail)
        id: tests
        continue-on-error: true
        run: mvn test -Punit-tests -pl hudi-common -Dtest="$NEW_TESTS" -Dsurefire.failIfNoSpecifiedTests=false $MVN_ARGS
      - name: Check that exactly the four new tests fail
        run: |
          set -eu
          echo "test step outcome: ${{ steps.tests.outcome }}"
          test "${{ steps.tests.outcome }}" = "failure"
          cd hudi-common/target/surefire-reports
          grep -h -B1 -A3 -E "<<< (FAILURE|ERROR)!" *.txt | head -80 || true
          failed=$(grep -h -E "<<< (FAILURE|ERROR)!" *.txt | grep -v "^Tests run:" | sed -E 's/^.*\.([A-Za-z0-9_]+) -- Time elapsed.*$/\1/' | sort -u)
          expected=$(printf '%s\n' \
            testAsNullableKeepsColumnsBesideNullableBlob \
            testAsNullableMakesRequiredBlobNullable \
            testBlobReferenceFieldsDoNotShadowTableColumns \
            testBlobReferenceIdsFromOlderReleasesAreUpgradedOnRead | sort -u)
          echo "failed:"; echo "$failed"
          test "$failed" = "$expected"
